<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>System Operacyjny Akademii Łazienka Na Lata™</title><meta name="robots" content="noindex,nofollow"><style>
:root{--navy:#071525;--navy2:#0d2339;--gold:#d3a64b;--paper:#f5f1e8;--ink:#132033;--muted:#6f7b86;--ok:#2f8f68;--bad:#b95555;--line:#d8d2c5;--card:#fffdf8}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--paper);color:var(--ink)}button,input,textarea,select{font:inherit}.app{min-height:100vh}.top{height:68px;background:var(--navy);color:white;display:flex;align-items:center;padding:0 22px;position:sticky;top:0;z-index:20;box-shadow:0 2px 14px #0004}.brand{font-weight:800;letter-spacing:.2px}.brand small{display:block;color:#b7c1cc;font-weight:500;font-size:12px}.top .right{margin-left:auto;display:flex;gap:8px}.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer}.btn.gold{background:var(--gold);color:#172131}.btn.dark{background:#18314a;color:white}.btn.light{background:white;border:1px solid var(--line)}.btn.danger{background:#f6dfdf;color:#8d2e2e}.layout{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 68px)}.side{background:#0b1b2d;color:#dce5ec;padding:22px 14px}.navbtn{width:100%;display:flex;gap:10px;align-items:center;padding:12px;border-radius:10px;background:transparent;color:inherit;border:0;text-align:left;cursor:pointer;margin:3px 0}.navbtn:hover,.navbtn.active{background:#17314c}.main{padding:28px;max-width:1250px;width:100%;margin:auto}.hero{background:linear-gradient(135deg,#08182a,#143a5a);color:white;border-radius:24px;padding:34px;box-shadow:0 18px 45px #0a1c3026}.hero h1{font-size:clamp(28px,4vw,52px);margin:0 0 10px}.hero p{color:#c6d2dc;max-width:760px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;margin-top:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 8px 24px #15263a0d}.span4{grid-column:span 4}.span6{grid-column:span 6}.span8{grid-column:span 8}.span12{grid-column:span 12}.kicker{text-transform:uppercase;letter-spacing:1.4px;font-size:11px;color:var(--gold);font-weight:800}.card h2,.card h3{margin:7px 0 10px}.metric{font-size:36px;font-weight:800}.muted{color:var(--muted)}.field{margin:15px 0}.field label{display:block;font-weight:750;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:white;border-radius:12px;padding:12px}.field textarea{min-height:110px;resize:vertical}.task{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}.task input[type=text]{flex:1}.done{text-decoration:line-through;opacity:.6}.progress{height:12px;background:#e8e2d7;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;background:var(--gold)}.pill{display:inline-flex;padding:6px 9px;border-radius:999px;background:#edf1f4;font-size:12px;margin:3px}.list{display:grid;gap:10px}.item{border:1px solid var(--line);border-radius:14px;padding:14px;background:white}.item .meta{font-size:12px;color:var(--muted)}.item .row{display:flex;gap:10px;align-items:center}.item .row .grow{flex:1}.wizard{max-width:760px;margin:28px auto}.step{font-size:12px;color:var(--gold);font-weight:800;letter-spacing:1.2px}.question{font-size:clamp(28px,4vw,48px);margin:16px 0}.biginput{width:100%;min-height:140px;border:2px solid var(--line);border-radius:18px;padding:18px;font-size:20px}.footerActions{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.hidden{display:none!important}.toast{position:fixed;right:20px;bottom:20px;background:#10253a;color:white;padding:12px 16px;border-radius:12px;opacity:0;transform:translateY(10px);transition:.2s;z-index:50}.toast.on{opacity:1;transform:none}.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}.search{display:flex;gap:8px}.search input{flex:1;border:1px solid var(--line);border-radius:12px;padding:12px}.tag{font-size:11px;background:#eef2f5;border-radius:999px;padding:4px 8px}.warn{color:#a36a12}.ok{color:var(--ok)}@media(max-width:850px){.layout{grid-template-columns:1fr}.side{display:flex;overflow:auto;padding:8px;position:sticky;top:68px;z-index:15}.navbtn{min-width:max-content}.main{padding:16px}.span4,.span6,.span8,.span12{grid-column:span 12}.top{padding:0 12px}.brand{font-size:14px}.top .right .hideMob{display:none}}
</style></head><body><div class="app"><header class="top"><div class="brand">Akademia Łazienka Na Lata™<small>System Operacyjny Właściciela</small></div><div class="right"><button class="btn dark hideMob" onclick="exportData()">Kopia JSON</button><button class="btn gold" onclick="showView('today')">Dziś</button></div></header><div class="layout"><aside class="side" id="nav"></aside><main class="main" id="view"></main></div></div><div class="toast" id="toast"></div><input hidden type="file" id="importFile" accept=".json,application/json">
<script>
const KEY='alnl_os_v3';const todayKey=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`};const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random();
const blank=()=>({days:{},entries:[],decisions:[],knowledge:[],projects:[],metrics:{sales:0,leads:0,revenue:0,publications:0},settings:{name:'Arek'},updatedAt:null});let DB=load();let current='home';let wizard={step:0,data:{}};
function load(){try{return Object.assign(blank(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return blank()}}function save(msg='Zapisano'){DB.updatedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(DB));toast(msg)}function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('on');clearTimeout(x._t);x._t=setTimeout(()=>x.classList.remove('on'),1600)}function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
const navItems=[['home','⌂','Start'],['today','◎','Dzisiaj'],['decisions','◆','Decyzje'],['knowledge','◫','Wiedza'],['projects','▦','Projekty'],['history','↺','Historia'],['search','⌕','Szukaj'],['backup','⇩','Kopie danych']];function renderNav(){nav.innerHTML=navItems.map(([id,ic,n])=>`<button class="navbtn ${current===id?'active':''}" onclick="showView('${id}')"><span>${ic}</span>${n}</button>`).join('')}
function showView(v){current=v;renderNav();({home:renderHome,today:renderToday,decisions:renderDecisions,knowledge:renderKnowledge,projects:renderProjects,history:renderHistory,search:renderSearch,backup:renderBackup}[v]||renderHome)()}
function day(k=todayKey()){if(!DB.days[k])DB.days[k]={focus:'',salesAction:'',tasks:[{t:'',done:false},{t:'',done:false},{t:'',done:false}],win:'',block:'',lesson:'',tomorrow:'',closed:false};return DB.days[k]}
function renderHome(){const d=day(),done=d.tasks.filter(x=>x.done).length,prev=new Date();prev.setDate(prev.getDate()-1);const pk=prev.toISOString().slice(0,10),pd=DB.days[pk];view.innerHTML=`<section class="hero"><div class="kicker">${new Date().toLocaleDateString('pl-PL',{weekday:'long',day:'numeric',month:'long'})}</div><h1>Dzień dobry, ${esc(DB.settings.name)}.</h1><p>${pd?.tomorrow?`Wczoraj zapisałeś pierwszy ruch: <b>${esc(pd.tomorrow)}</b>`:'Rozpocznij dzień od jednej decyzji: co naprawdę przesunie Akademię do przodu?'}</p><div class="actions"><button class="btn gold" onclick="startMorning()">Rozpocznij dzień</button><button class="btn dark" onclick="showView('today')">Wróć do planu</button><button class="btn dark" onclick="startEvening()">Zamknij dzień</button></div></section><div class="grid"><div class="card span4"><div class="kicker">Postęp dnia</div><div class="metric">${done}/3</div><div class="progress"><i style="width:${done/3*100}%"></i></div></div><div class="card span4"><div class="kicker">Sprzedaż</div><div class="metric">${DB.metrics.sales}</div><div class="muted">sprzedaży zapisanych w systemie</div></div><div class="card span4"><div class="kicker">Pamięć</div><div class="metric">${DB.entries.length+DB.knowledge.length}</div><div class="muted">zapisanych obserwacji i atomów wiedzy</div></div><div class="card span12"><h3>Najbliższy ruch</h3><p>${d.tasks.find(x=>x.t&&!x.done)?esc(d.tasks.find(x=>x.t&&!x.done).t):d.tomorrow?esc(d.tomorrow):'Nie ustawiono jeszcze planu dnia.'}</p></div></div>`}
function startMorning(){wizard={step:0,data:{}};renderMorning()}function renderMorning(){const old=day();const steps=[{q:'Co dzisiaj naprawdę przesunie Akademię do przodu?',k:'focus',v:old.focus},{q:'Jakie jedno działanie może przybliżyć pierwszą lub następną sprzedaż?',k:'salesAction',v:old.salesAction},{q:'Wpisz pierwszy z trzech priorytetów.',k:'t1',v:old.tasks[0].t},{q:'Wpisz drugi priorytet.',k:'t2',v:old.tasks[1].t},{q:'Wpisz trzeci priorytet.',k:'t3',v:old.tasks[2].t}];const s=steps[wizard.step];view.innerHTML=`<div class="wizard"><div class="step">PORANNY START · KROK ${wizard.step+1} Z ${steps.length}</div><div class="question">${s.q}</div><textarea id="wizInput" class="biginput">${esc(wizard.data[s.k]??s.v??'')}</textarea><div class="footerActions"><button class="btn light" onclick="${wizard.step?'wizardBack()':"showView('home')"}">Wstecz</button><button class="btn gold" onclick="wizardNext()">${wizard.step===steps.length-1?'Utwórz plan dnia':'Dalej'}</button></div></div>`;setTimeout(()=>wizInput.focus(),50)}function wizardBack(){wizard.step--;renderMorning()}function wizardNext(){const keys=['focus','salesAction','t1','t2','t3'];wizard.data[keys[wizard.step]]=wizInput.value.trim();if(wizard.step<4){wizard.step++;renderMorning();return}const d=day();d.focus=wizard.data.focus;d.salesAction=wizard.data.salesAction;d.tasks=[1,2,3].map(i=>({t:wizard.data['t'+i],done:false}));d.closed=false;save('Plan dnia utworzony');showView('today')}
function renderToday(){const d=day(),done=d.tasks.filter(x=>x.done).length;view.innerHTML=`<div class="grid"><div class="card span8"><div class="kicker">Cel dnia</div><h2>${esc(d.focus||'Nie ustawiono celu')}</h2><div class="kicker" style="margin-top:20px">Działanie sprzedażowe</div><p>${esc(d.salesAction||'Nie ustawiono działania sprzedażowego')}</p><div class="progress"><i style="width:${done/3*100}%"></i></div><p class="muted">Wykonano ${done} z 3 priorytetów.</p><div id="tasks"></div></div><div class="card span4"><h3>Szybki zapis</h3><div class="field"><textarea id="quick" placeholder="Rozmowa z klientem, pomysł, błąd, obserwacja…"></textarea></div><button class="btn gold" onclick="quickAdd()">Zapisz do dziennika</button><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><button class="btn dark" onclick="startEvening()">Zamknij dzień</button><button class="btn light" style="margin-top:8px" onclick="startMorning()">Zmień plan</button></div></div>`;const host=document.getElementById('tasks');d.tasks.forEach((t,i)=>{const row=document.createElement('div');row.className='task '+(t.done?'done':'');row.innerHTML=`<input type="checkbox" ${t.done?'checked':''}><input type="text" value="${esc(t.t)}" placeholder="Priorytet ${i+1}">`;const [cb,tx]=row.querySelectorAll('input');cb.onchange=()=>{t.done=cb.checked;save();renderToday()};tx.oninput=()=>{t.t=tx.value;localStorage.setItem(KEY,JSON.stringify(DB))};host.appendChild(row)})}
function quickAdd(){const v=quick.value.trim();if(!v)return;DB.entries.unshift({id:uid(),date:new Date().toISOString(),text:v});save('Wpis dodany');quick.value=''}
function startEvening(){wizard={step:0,data:{}};renderEvening()}function renderEvening(){const d=day(),steps=[['win','Co dzisiaj było największym zwycięstwem?',d.win],['block','Co było największą blokadą albo błędem?',d.block],['lesson','Czego nauczył Cię dzisiejszy dzień?',d.lesson],['tomorrow','Co zrobisz jutro jako pierwsze?',d.tomorrow]];const [k,q,v]=steps[wizard.step];view.innerHTML=`<div class="wizard"><div class="step">ZAMKNIĘCIE DNIA · KROK ${wizard.step+1} Z 4</div><div class="question">${q}</div><textarea id="wizInput" class="biginput">${esc(wizard.data[k]??v??'')}</textarea><div class="footerActions"><button class="btn light" onclick="${wizard.step?'eveningBack()':"showView('today')"}">Wstecz</button><button class="btn gold" onclick="eveningNext()">${wizard.step===3?'Zamknij dzień':'Dalej'}</button></div></div>`}function eveningBack(){wizard.step--;renderEvening()}function eveningNext(){const keys=['win','block','lesson','tomorrow'];wizard.data[keys[wizard.step]]=wizInput.value.trim();if(wizard.step<3){wizard.step++;renderEvening();return}Object.assign(day(),wizard.data,{closed:true,closedAt:new Date().toISOString()});save('Dzień zamknięty');showView('home')}
function renderDecisions(){view.innerHTML=`<div class="grid"><div class="card span4"><h2>Nowa decyzja</h2>${field('decProblem','Problem','Co wymaga rozstrzygnięcia?')}${field('decOptions','Opcje','Jakie rozwiązania rozważasz?','textarea')}${field('decChoice','Decyzja','Co wybierasz?')}${field('decWhy','Uzasadnienie','Dlaczego?','textarea')}${field('decReview','Data rewizji','','date')}<button class="btn gold" onclick="addDecision()">Zapisz decyzję</button></div><div class="card span8"><h2>Rejestr decyzji</h2><div class="list">${DB.decisions.length?DB.decisions.map(x=>item(`<b>${esc(x.choice)}</b><p>${esc(x.problem)}</p><div class="meta">${new Date(x.date).toLocaleString('pl-PL')} · rewizja: ${esc(x.review||'bez terminu')}</div>`)).join(''):'<div class="empty">Brak decyzji.</div>'}</div></div></div>`}function field(id,l,p,t='text'){return `<div class="field"><label>${l}</label>${t==='textarea'?`<textarea id="${id}" placeholder="${p}"></textarea>`:`<input id="${id}" type="${t}" placeholder="${p}">`}</div>`}function addDecision(){if(!decChoice.value.trim())return toast('Wpisz decyzję');DB.decisions.unshift({id:uid(),date:new Date().toISOString(),problem:decProblem.value.trim(),options:decOptions.value.trim(),choice:decChoice.value.trim(),why:decWhy.value.trim(),review:decReview.value});save('Decyzja zapisana');renderDecisions()}
function renderKnowledge(){view.innerHTML=`<div class="grid"><div class="card span4"><h2>Zapisz wiedzę</h2>${field('knTitle','Tytuł','Np. Greenford — brak hydroizolacji')}${field('knBody','Treść','Fakt, obserwacja, wniosek, procedura…','textarea')}${field('knTags','Tagi','hydroizolacja, Greenford, błąd')}<button class="btn gold" onclick="addKnowledge()">Zapisz wiedzę</button></div><div class="card span8"><h2>Pamięć systemu</h2><div class="list">${DB.knowledge.length?DB.knowledge.map(x=>item(`<b>${esc(x.title)}</b><p>${esc(x.body)}</p><div>${x.tags.map(t=>`<span class="pill">${esc(t)}</span>`).join('')}</div>`)).join(''):'<div class="empty">Brak zapisanej wiedzy.</div>'}</div></div></div>`}function addKnowledge(){if(!knTitle.value.trim()&&!knBody.value.trim())return;DB.knowledge.unshift({id:uid(),date:new Date().toISOString(),title:knTitle.value.trim(),body:knBody.value.trim(),tags:knTags.value.split(',').map(x=>x.trim()).filter(Boolean)});save('Wiedza zapisana');renderKnowledge()}
function renderProjects(){view.innerHTML=`<div class="grid"><div class="card span4"><h2>Nowy projekt</h2>${field('prName','Nazwa','Np. Pierwsza sprzedaż Audytu Wideo')}${field('prGoal','Rezultat','Po czym poznasz, że projekt jest skończony?','textarea')}${field('prNext','Następny ruch','Najbliższe fizyczne działanie')}<button class="btn gold" onclick="addProject()">Dodaj projekt</button></div><div class="card span8"><h2>Aktywne projekty</h2><div class="list">${DB.projects.length?DB.projects.map((x,i)=>item(`<div class="row"><div class="grow"><b>${esc(x.name)}</b><p>${esc(x.goal)}</p><div class="meta">Następny ruch: ${esc(x.next||'—')}</div></div><button class="btn light" onclick="toggleProject(${i})">${x.done?'Wznów':'Zamknij'}</button></div>`)).join(''):'<div class="empty">Brak projektów.</div>'}</div></div></div>`}function addProject(){if(!prName.value.trim())return;DB.projects.unshift({id:uid(),name:prName.value.trim(),goal:prGoal.value.trim(),next:prNext.value.trim(),done:false,date:new Date().toISOString()});save('Projekt dodany');renderProjects()}function toggleProject(i){DB.projects[i].done=!DB.projects[i].done;save();renderProjects()}
function item(html){return `<div class="item">${html}</div>`}function renderHistory(){const keys=Object.keys(DB.days).sort().reverse();view.innerHTML=`<div class="card"><h2>Historia dni</h2><div class="list">${keys.length?keys.map(k=>{const d=DB.days[k];return item(`<b>${k}</b> ${d.closed?'<span class="tag ok">zamknięty</span>':'<span class="tag warn">otwarty</span>'}<p><b>Cel:</b> ${esc(d.focus||'—')}</p><p><b>Sprzedaż:</b> ${esc(d.salesAction||'—')}</p><p><b>Jutro:</b> ${esc(d.tomorrow||'—')}</p>`) }).join(''):'<div class="empty">Brak historii.</div>'}</div></div>`}
function renderSearch(){view.innerHTML=`<div class="card"><h2>Przeszukaj cały system</h2><div class="search"><input id="q" placeholder="Wpisz klienta, projekt, błąd, decyzję lub temat"><button class="btn gold" onclick="doSearch()">Szukaj</button></div><div id="results" class="list" style="margin-top:18px"></div></div>`;q.onkeydown=e=>{if(e.key==='Enter')doSearch()}}function doSearch(){const s=q.value.trim().toLowerCase(),r=[];if(!s)return;DB.entries.forEach(x=>x.text.toLowerCase().includes(s)&&r.push(['Dziennik',x.text]));DB.knowledge.forEach(x=>(x.title+' '+x.body+' '+x.tags.join(' ')).toLowerCase().includes(s)&&r.push(['Wiedza',x.title+' — '+x.body]));DB.decisions.forEach(x=>(x.problem+' '+x.choice+' '+x.why).toLowerCase().includes(s)&&r.push(['Decyzja',x.choice+' — '+x.problem]));DB.projects.forEach(x=>(x.name+' '+x.goal+' '+x.next).toLowerCase().includes(s)&&r.push(['Projekt',x.name+' — '+x.next]));Object.entries(DB.days).forEach(([k,d])=>JSON.stringify(d).toLowerCase().includes(s)&&r.push(['Dzień '+k,d.focus]));results.innerHTML=r.length?r.map(x=>item(`<span class="tag">${x[0]}</span><p>${esc(x[1])}</p>`)).join(''):'<div class="empty">Brak wyników.</div>'}
function renderBackup(){view.innerHTML=`<div class="grid"><div class="card span6"><h2>Kopia bezpieczeństwa</h2><p>Pobierz pełny zapis aplikacji do pliku JSON.</p><button class="btn gold" onclick="exportData()">Pobierz kopię</button></div><div class="card span6"><h2>Przywracanie</h2><p>Wczytaj wcześniej pobraną kopię.</p><button class="btn dark" onclick="importFile.click()">Wczytaj kopię</button></div><div class="card span12"><h3>Stan zapisu</h3><p class="muted">Dane zapisują się automatycznie w pamięci tej przeglądarki. Ostatnia zmiana: ${DB.updatedAt?new Date(DB.updatedAt).toLocaleString('pl-PL'):'brak'}.</p></div></div>`}function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(DB,null,2)],{type:'application/json'}));a.download='System-Operacyjny-Akademii-'+todayKey()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}importFile.onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());DB=Object.assign(blank(),d);save('Kopia przywrócona');showView('home')}catch(err){alert('Nieprawidłowy plik kopii.')}};
renderNav();showView('home');
</script></body></html>
