      Raport inwestora „Czego nie widać po remoncie łazienki” · Ekspert remontów łazienek, 20+ lat praktyki.
      <div class="disc">Ten raport ma charakter informacyjny i służy podniesieniu świadomości inwestora. Nie zastępuje projektu, kierownika budowy ani indywidualnej oceny technicznej wykonawcy. © <span id="yr"></span> Wszelkie prawa zastrzeżone.</div>
    </footer>

  </main>
</div>

<script>
/* ===== reading progress ===== */
const progress = document.getElementById('progress');
const content = document.querySelector('.content');
function updateProgress(){
  const h = document.documentElement;
  const scrolled = h.scrollTop;
  const max = h.scrollHeight - h.clientHeight;
  progress.style.width = (max>0 ? (scrolled/max*100) : 0) + '%';
}
window.addEventListener('scroll', updateProgress, {passive:true});
updateProgress();

/* ===== mobile rail toggle ===== */
const rail = document.getElementById('rail');
const overlay = document.getElementById('overlay');
const tbMenu = document.getElementById('tbMenu');
function toggleRail(open){
  rail.classList.toggle('open', open);
  overlay.classList.toggle('show', open);
  tbMenu.classList.toggle('open', open);
  document.body.style.overflow = open ? 'hidden' : '';
}
tbMenu.addEventListener('click', ()=> toggleRail(!rail.classList.contains('open')));
overlay.addEventListener('click', ()=> toggleRail(false));

/* ===== TOC: active section + smooth scroll + close on mobile ===== */
const tocLinks = Array.from(document.querySelectorAll('#toc a'));
const sections = tocLinks.map(a => document.getElementById(a.dataset.sec)).filter(Boolean);

const spy = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      const id = e.target.id;
      tocLinks.forEach(a => a.classList.toggle('active', a.dataset.sec === id));
    }
  });
},{rootMargin:'-45% 0px -50% 0px', threshold:0});
sections.forEach(s => spy.observe(s));

tocLinks.forEach(a=>{
  a.addEventListener('click', (e)=>{
    const target = document.getElementById(a.dataset.sec);
    if(target){
      e.preventDefault();
      const y = target.getBoundingClientRect().top + window.scrollY - 24;
      window.scrollTo({top:y, behavior:'smooth'});
      if(window.innerWidth <= 860) toggleRail(false);
    }
  });
});

/* ===== scroll reveal ===== */
const io = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{
    if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }
  });
},{threshold:.1, rootMargin:'0px 0px -50px 0px'});
document.querySelectorAll('.reveal').forEach((el,i)=>{
  el.style.transitionDelay = (i % 3) * 70 + 'ms';
  io.observe(el);
});

/* ===== CTA: link do Systemu Inwestora =====
   ┌─────────────────────────────────────────────────────────┐
   │  WSTAW TUTAJ swój link (strona Systemu lub płatność).    │
   │  Dopóki pole jest puste (""), przycisk pokazuje krótką   │
   │  informację zamiast prowadzić donikąd.                   │
   └─────────────────────────────────────────────────────────┘ */
const SYSTEM_URL = "https://buy.stripe.com/6oUfZj4LV71964U7mF0Jq06"; // ← np. "https://buy.stripe.com/...". Zostaw "" jeśli jeszcze nie masz linku.

const ctaBtn = document.getElementById('ctaSystem');
if(SYSTEM_URL){
  ctaBtn.setAttribute('href', SYSTEM_URL);
}else{
  ctaBtn.addEventListener('click', (e)=>{
    e.preventDefault();
    ctaBtn.innerHTML = 'Link będzie dostępny wkrótce';
    ctaBtn.style.opacity = '.75';
    ctaBtn.style.pointerEvents = 'none';
  });
}

/* ===== year ===== */
document.getElementById('yr').textContent = new Date().getFullYear();

/* ===== udostępnianie raportu ===== */
(function(){
  const pageUrl = window.location.href;
  const shareText = 'Najdroższe błędy w łazience nie są widoczne po remoncie. Raport inwestora — Łazienka Na Lata™.';
  const shareData = {
    title: 'Czego nie widać po remoncie łazienki',
    text: shareText,
    url: pageUrl
  };
  const toast = document.getElementById('shareToast');
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(()=>toast.classList.remove('show'), 3200);
  }
  function copyLink(){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(pageUrl).then(()=>showToast('Skopiowano link — możesz go teraz wkleić.'))
        .catch(()=>fallbackCopy(pageUrl));
    }else{ fallbackCopy(pageUrl); }
  }
  function fallbackCopy(text){
    const t = document.createElement('textarea');
    t.value = text; t.style.position='fixed'; t.style.opacity='0';
    document.body.appendChild(t); t.select();
    try{ document.execCommand('copy'); showToast('Skopiowano link — możesz go teraz wkleić.'); }
    catch(e){ showToast('Skopiuj link z paska adresu przeglądarki.'); }
    document.body.removeChild(t);
  }

  // WhatsApp i Facebook — działają na telefonie i na komputerze
  const enc = encodeURIComponent;
  const wa = document.getElementById('shareWa');
  if(wa) wa.href = 'https://wa.me/?text=' + enc(shareText + ' ' + pageUrl);
  const fb = document.getElementById('shareFb');
  if(fb) fb.href = 'https://www.facebook.com/sharer/sharer.php?u=' + enc(pageUrl);

  // Natywne "Udostępnij" — tylko mobile (przycisk i tak ukryty na desktopie przez CSS)
  const nativeBtn = document.getElementById('shareNative');
  if(nativeBtn){
    nativeBtn.addEventListener('click', ()=>{
      if(navigator.share){ navigator.share(shareData).catch(()=>{}); }
      else { copyLink(); }
    });
  }
  // Kopiuj link
  const copyBtn = document.getElementById('shareCopy');
  if(copyBtn) copyBtn.addEventListener('click', copyLink);
})();

/* ===== keyboard: Esc closes rail ===== */
document.addEventListener('keydown', e=>{ if(e.key==='Escape') toggleRail(false); });

/* ===== zapis postępu czytania (działa po publikacji na serwerze) ===== */
(function(){
  const KEY = 'lnl_raport_scroll';
  let saveTimer;
  // restore
  try{
    const saved = parseInt(localStorage.getItem(KEY)||'0',10);
    if(saved > 600){
      // pokaż dyskretny przycisk powrotu zamiast auto-skoku (mniej nachalne)
      const bar = document.createElement('button');
      bar.textContent = '↓ Wróć tam, gdzie skończyłeś';
      bar.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:90;'
        +'font-family:Archivo,sans-serif;font-size:.86rem;font-weight:600;color:#0a1322;'
        +'background:linear-gradient(135deg,#c8a35a,#e0c587);border:none;border-radius:100px;'
        +'padding:11px 22px;cursor:pointer;box-shadow:0 10px 30px -8px rgba(200,163,90,.5);'
        +'transition:opacity .3s,transform .3s;';
      bar.addEventListener('click', ()=>{
        window.scrollTo({top:saved, behavior:'smooth'});
        bar.style.opacity='0'; setTimeout(()=>bar.remove(),300);
      });
      document.body.appendChild(bar);
      // auto-hide once user scrolls near saved point or after 9s
      setTimeout(()=>{ if(bar.parentNode){bar.style.opacity='0'; setTimeout(()=>bar.remove(),300);} }, 9000);
    }
  }catch(e){}
  // save (throttled)
  window.addEventListener('scroll', ()=>{
    clearTimeout(saveTimer);
    saveTimer = setTimeout(()=>{ try{localStorage.setItem(KEY, String(window.scrollY));}catch(e){} }, 400);
  }, {passive:true});
})();
</script>
</body>
</html>
